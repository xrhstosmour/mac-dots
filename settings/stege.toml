theme = "system"

# System-wide shortcuts, resolved after the modifier swap, so what is written
# here is what macOS receives rather than which key is under the finger. `ctrl`
# is the key third from the left. `toggle-shortcut`, which hides the bar
# entirely, is deliberately not set: the chevron already hands back the system
# bar and a whole bar disappearing by accident is worse than reaching for it.
#
# `ctrl+r` was the obvious pick for reveal and is taken twice over, by
# `aerospace.toml`'s `layout tiles horizontal vertical` and by five `Visual
# Studio Code` bindings including Find & Replace. What replaced it is the key
# that draws the chevron, without the shift that would make it a literal `<`.
# Nothing in `AeroSpace` claims either of these. In `Visual Studio Code`
# `ctrl+,` is Settings and `ctrl+m` is `toggleTabFocusMode`, so Settings is the
# one real cost and is still on the menu under Code.

# The other applications' status items, the row behind the chevron, on the key
# that draws it. Only opens the row: `reveal-hide-shortcut` is the only key
# that closes it again.
reveal-shortcut = "ctrl+,"

# Closes that same row on its own, regardless of `reveal-shortcut` above, on
# the key beside it.
reveal-hide-shortcut = "ctrl+."

# The frontmost application's menu titles, in place of the workspace pills and
# held there. Pressing it again puts the row away, and so does switching
# application. The titles are clicked, not walked with the keyboard, see
# https://github.com/xrhstosmour/stege/issues/218. Left unset: not worth a key
# for a row that cannot be walked once it is open.
# menu-shortcut = "ctrl+m"

[widgets]
# The bar, left to right. "spacer" pushes what follows to the right, "divider"
# draws a rule.
displayed = [
    "default.appleMenu",
    "default.spaces",
    "default.applicationMenu",
    "spacer",
    "default.reveal",
    "default.display",
    "default.audio",
    "default.bluetooth",
    "default.network",
    "default.notifications",
    "default.battery",
    "divider",
    "default.time",
]

[widgets.default.appleMenu]
icon-size = 14
# About, Settings, Sleep, Lock, Log Out, not the full system menu.
short-menu = true

[widgets.default.reveal]
mode = "extras"
icon-size = 18
# Draws the icons in one colour rather than their own. "colour" is the default.
icon-style = "colour"

# Keeps the row open until it is asked to close, rather than when the pointer
# leaves.
sticky = true
return-threshold = 80
timeout = 10

# Always in the bar, never behind the chevron.
# always-show = ["Docker"]

# Never shown behind the chevron. `1Password` is driven by its own shortcuts,
# `AeroSpace` by the keyboard and by the workspace pills at the left of the bar,
# and `Amphetamine` is set once and left alone, so none of the three is worth a
# place in a row that exists to hand back what hiding the system menu bar took
# away.
#
# Names rather than bundle identifiers, which Stege matches whole and without
# regard to case. Right-clicking an icon in the row and choosing Hide writes
# into this same list.
hidden = ["1Password", "AeroSpace", "Amphetamine"]

[widgets.default.spaces]
# The workspace number or letter.
space.show-key = true
# The focused window's title.
window.show-title = true
window.title.max-length = 50
# For applications whose title never says which window it is:
# window.title.always-display-app-name-for = ["Mail", "Chrome"]

[widgets.default.applicationMenu]
max-menus = 6
# The first menu drawn bold, the way macOS does.
show-application-name = true
# "hover" reveals them while the pointer rests on the pill of the window that is
# already focused, and drops them again as soon as it moves off. "click" does
# the same swap on a click, "always" keeps every menu in the bar, "modifier"
# holds them open while option is held.
visibility = "hover"
# Only read when visibility = "modifier", which this is not. Kept set for
# whenever it changes back.
modifier-key = "option"

[widgets.default.notifications]
show-control-centre = false
# Off because remembering writes every notification's title, subtitle and body
# to ~/Library/Preferences in plaintext.
remember-between-launches = false

[widgets.default.display]
# The icon already conveys the level.
show-percentage = false

[widgets.default.audio]
# The icon already conveys the level.
show-percentage = false
# "speaker" is the default.
glyph = "speaker"
# The one network request Stege makes.
fetch-artwork = true

[widgets.default.keyboardLayout]
# "Greek" rather than "GR". Configured but not currently in `displayed`, kept
# for when it goes back in.
show-full-name = false

[widgets.default.bluetooth]
show-battery = true
hide-when-off = false

[widgets.default.network]
show-name = false
hide-when-disconnected = false

[widgets.default.battery]
# "inside" is the default, "off" draws no glyph.
style = "inside"
show-percentage = true
warning-level = 30
critical-level = 10

[widgets.default.time]
format = "E d MMM  HH:mm"
calendar.format = "HH:mm"
calendar.show-events = true
calendar.countdown = true
# Only these calendars.
# calendar.allow-list = ["Home"]
# Every calendar but these.
# calendar.deny-list = ["Work"]

[widgets.default.time.popup]
# "vertical" is the other one.
view-variant = "box"

[bar.foreground]
# A little taller than the system menu bar, which measures about 35 here.
height = 44
horizontal-padding = 12
trailing-padding = 12
spacing = 10

[bar.background]
displayed = true
# 7 is solid black. Matching the foreground height makes the notch disappear
# into the bar instead of sitting in a translucent strip.
blur = 7
height = 44
