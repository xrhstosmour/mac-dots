theme = "system"

[widgets]
displayed = [
    "default.appleMenu",
    "default.spaces",
    "default.applicationMenu",
    "spacer",
    "default.reveal",
    "default.privacy",
    "default.keyboardLayout",
    "default.display",
    "default.audio",
    "default.microphone",
    "default.bluetooth",
    "default.network",
    "default.notifications",
    "default.battery",
    "divider",
    "default.time",
]

# Orange for the microphone, green for the camera, purple for the screen being
# recorded. macOS draws its own dot in the very corner above every window, but
# it is one dot for all three and it half covers the clock, so this says which
# device is actually in use. Dots rather than icons, matching the system's own.
# Set always-show to keep all three drawn, dimmed, so nothing in the bar moves
# when one lights up.
[widgets.default.privacy]
style = "dot"
always-show = false

[widgets.default.spaces]
space.show-key = true
window.show-title = true
window.title.max-length = 50

[widgets.default.applicationMenu]
max-menus = 6
show-application-name = true
# "hover" reveals them while the pointer rests on the pill of the window that is
# already focused, and drops them again as soon as it moves off. "click" does
# the same swap on a click, "always" keeps every menu in the bar, "modifier"
# holds them open while option is held.
visibility = "hover"

[widgets.default.monitor]
show-network = true

[widgets.default.audio]
show-percentage = false

[widgets.default.battery]
show-percentage = true

[widgets.default.time]
format = "E d MMM  HH:mm"

[widgets.default.time.popup]
view-variant = "vertical"

[bar.foreground]
# A little taller than the system menu bar, which measures about 35 here.
height = 44
horizontal-padding = 12
spacing = 10

[bar.background]
displayed = true
# 7 is solid black. Matching the foreground height makes the notch disappear
# into the bar instead of sitting in a translucent strip.
blur = 7
height = 44
